server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" always;

  # /download shows the newest Mac version: the update feed, from this origin (no CORS).
  # A variable in proxy_pass makes nginx resolve the name per request, so nginx starts
  # also when DNS does not answer.
  location = /download/latest.json {
    resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
    set $feed https://releases.zog-tech.com/zoggyfin/latest.json;
    proxy_pass $feed;
    proxy_ssl_server_name on;
    proxy_set_header Host releases.zog-tech.com;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  error_page 404 /404.html;
}
