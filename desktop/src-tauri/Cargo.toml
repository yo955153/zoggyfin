[package]
name = "zoggyfin-desktop"
version = "0.1.0"
description = "Zoggyfin desktop: the web app in a Tauri window, with libmpv for video"
license = "MPL-2.0"
edition = "2021"
publish = false

[lib]
name = "zoggyfin_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-open-gl = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
