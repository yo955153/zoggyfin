<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoggyfin Screen Mockups</title>
<style>
/* Tokens: mirror docs/design/theme.ts */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", system-ui, "Segoe UI", "Noto Sans", "Noto Sans Arabic", "Geeza Pro", sans-serif;
}
.dark{
  --bg:#0B0B0E; --bgGrouped:#0B0B0E; --surface:#16161A; --surface2:#202026; --surface3:#2A2A31;
  --text:#F5F5F7; --text2:#A8A8B3; --text3:#96969F; --accent:#FF7A59; --onAccent:#1A0B06;
  --accentSoft:rgba(255,122,89,.16); --success:#3DD68C; --warning:#F2B54B; --danger:#FF6B6B;
  --sep:rgba(255,255,255,.09); --ctrl:#71717C; --glass:rgba(30,30,36,.72); --glassBorder:rgba(255,255,255,.10);
  --shadowF:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
.light{
  --bg:#FFFFFF; --bgGrouped:#F2F2F5; --surface:#FFFFFF; --surface2:#EBEBEF; --surface3:#E2E2E7;
  --text:#111114; --text2:#595963; --text3:#63636C; --accent:#B53A17; --onAccent:#FFFFFF;
  --accentSoft:rgba(181,58,23,.10); --success:#12703F; --warning:#855300; --danger:#BE2329;
  --sep:rgba(17,17,20,.12); --ctrl:#7E7E88; --glass:rgba(250,250,252,.78); --glassBorder:rgba(0,0,0,.08);
  --shadowF:0 10px 30px rgba(20,20,26,.18);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#1B1B1F;color:#EDEDF0;-webkit-font-smoothing:antialiased;padding:48px 40px 80px}
.page-head{display:flex;align-items:center;gap:16px;margin:0 auto 40px;max-width:1360px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:.2px}
.page-head p{color:#A8A8B3;font-size:15px;margin-top:4px}
.grid{display:flex;flex-wrap:wrap;gap:44px 40px;justify-content:center;max-width:1360px;margin:0 auto}
figure{display:flex;flex-direction:column;align-items:center;gap:14px}
figcaption{font-size:14px;color:#A8A8B3;font-weight:500;max-width:417px;text-align:center;line-height:20px}
.land figcaption,.wide figcaption{max-width:none}
.edgefade{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:25;pointer-events:none}
figcaption b{color:#F5F5F7;font-weight:600}

/* Device frames */
.phone{width:417px;height:876px;border-radius:66px;background:#2B2B30;padding:12px;box-shadow:0 0 0 2px #3A3A40 inset,0 30px 60px rgba(0,0,0,.45)}
.screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:var(--bg);color:var(--text)}
.land .phone{width:876px;height:417px}
.land .screen{width:852px;height:393px}
.ipad{width:1204px;height:844px;border-radius:40px;background:#2B2B30;padding:12px;box-shadow:0 0 0 2px #3A3A40 inset,0 30px 60px rgba(0,0,0,.45)}
.ipad .screen{width:1180px;height:820px;border-radius:28px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font-weight:600;font-size:16px;z-index:40}
.status .sys{display:flex;gap:6px;align-items:center}
.status svg{width:18px;height:12px}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:60}

/* Icons */
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.fill{fill:currentColor;stroke:none}
.i.s{width:17px;height:17px}.i.xs{width:13px;height:13px}.i.l{width:28px;height:28px}.i.xl{width:36px;height:36px}.i.xxl{width:48px;height:48px}

/* Screen content */
.content{position:absolute;inset:0;overflow:hidden;padding-top:54px}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0;height:44px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.4px;padding:2px 16px 8px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#5B6B7A,#2E3640);display:grid;place-items:center;font-size:14px;font-weight:600;color:#fff}
.hbtn{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--text)}
.section-h{display:flex;align-items:center;gap:4px;font-size:20px;line-height:25px;font-weight:600;letter-spacing:-.45px;padding:0 16px 10px}
.section-h .i{color:var(--text3);width:18px;height:18px}
.row{display:flex;gap:12px;padding:0 16px;overflow:hidden;margin-bottom:28px}
.tile{flex:none;display:flex;flex-direction:column;gap:6px}
.art{position:relative;border-radius:10px;overflow:hidden;background:var(--surface)}
.art::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.light .art::after{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.poster{width:116px;height:174px}
.thumb{width:264px;height:148px}
.square{width:148px;height:148px;border-radius:8px}
.circle{width:88px;height:88px;border-radius:50%}
.t1{font-size:14px;line-height:18px;font-weight:600;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12px;line-height:16px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:absolute;left:10px;right:10px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.prog>i{display:block;height:100%;background:#fff;border-radius:2px}
.scrimb{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.onart{position:absolute;left:10px;right:10px;bottom:20px;color:#fff}
.onart .t1{font-size:15px}.onart .t2{color:rgba(255,255,255,.78)}
.badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(20,20,24,.6);backdrop-filter:blur(8px);display:grid;place-items:center;color:#fff}
.badge.ok{background:rgba(20,20,24,.6)}
.fb-title{position:absolute;left:10px;right:10px;bottom:10px;color:#fff;font-size:15px;line-height:19px;font-weight:600;letter-spacing:-.2px}
.fb-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);color:rgba(255,255,255,.5)}
/* Short labels in lists keep the UI start edge; direction comes from the content. Standalone blocks align by content. */
.t1[dir=rtl],.t2[dir=rtl],.grow[dir=rtl]{text-align:left}
.blk[dir=rtl]{text-align:right}
.ar{line-height:1.18em}

/* Tab bar: iOS 26 floating glass */
.tabbar{position:absolute;left:16px;right:86px;bottom:26px;height:62px;border-radius:31px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:.5px solid var(--glassBorder);display:flex;justify-content:space-around;align-items:center;box-shadow:var(--shadowF);z-index:30;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--text);width:68px;padding:6px 0;border-radius:24px}
.tab.on{color:var(--accent);background:var(--accentSoft)}
.tab .i{width:24px;height:24px}
.searchbtn{position:absolute;right:16px;bottom:26px;width:62px;height:62px;border-radius:50%;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:.5px solid var(--glassBorder);display:grid;place-items:center;box-shadow:var(--shadowF);z-index:30;color:var(--text)}
.searchbtn.on{color:var(--accent)}
.mini{position:absolute;left:16px;right:16px;bottom:96px;height:52px;border-radius:26px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:.5px solid var(--glassBorder);display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;box-shadow:var(--shadowF);z-index:30}
.mini .art{width:38px;height:38px;border-radius:8px}
.mini .meta{flex:1;min-width:0}
.mini .t1{font-size:14px}.mini .t2{font-size:12px}
.mini .ctl{width:40px;height:40px;display:grid;place-items:center;color:var(--text)}
.mini .mprog{position:absolute;left:22px;right:22px;bottom:0;height:2px;border-radius:1px;background:var(--sep);overflow:hidden}
.mini .mprog>i{display:block;height:100%;width:38%;background:var(--accent)}

/* Buttons and chips */
.btn{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;letter-spacing:-.4px}
.btn.primary{background:var(--accent);color:var(--onAccent)}
.btn.tonal{background:var(--surface2);color:var(--text)}
.chips{display:flex;gap:8px;padding:0 16px 14px;overflow:hidden}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;background:var(--surface2);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--text)}
.chip.on{background:var(--text);color:var(--bg)}
.chip .i{width:15px;height:15px}

/* Lists */
.list{margin:0 16px;border-radius:14px;background:var(--surface);overflow:hidden}
.light .list{background:var(--surface)}
.li{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:60px;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:var(--inset,14px);right:0;height:.5px;background:var(--sep)}
.li .grow{flex:1;min-width:0}
.li .t1{font-size:16px;font-weight:500;letter-spacing:-.3px}
.li .t2{font-size:13px}
.num{width:22px;text-align:center;color:var(--text3);font-size:15px;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--text3)}
.acc{color:var(--accent)}

/* Segmented pager strip */
.seg{display:flex;gap:22px;padding:0 16px;position:relative;height:38px;align-items:center;border-bottom:.5px solid var(--sep);margin-bottom:14px}
.seg span{font-size:15px;font-weight:600;color:var(--text2);letter-spacing:-.2px}
.seg span.on{color:var(--text)}
.seg .ind{position:absolute;bottom:-1px;height:3px;border-radius:2px;background:var(--accent)}

/* Players */
.np{position:absolute;inset:0;color:#fff;padding:62px 24px 0}
.grabber{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 26px}
.scrub{height:6px;border-radius:3px;background:rgba(255,255,255,.25);position:relative}
.scrub>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(255,255,255,.92)}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:rgba(255,255,255,.66);margin-top:8px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;justify-content:space-between;align-items:center;padding:0 22px}
.glasspill{background:rgba(20,20,24,.38);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:.5px solid rgba(255,255,255,.14);border-radius:22px}
</style>
</head>

<script>
// Same algorithm as fallbackArt() in theme.ts.
function fnv1a(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
function hsl(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function fallbackCSS(title){const key=title.normalize('NFKC').trim().toLowerCase();const h=fnv1a(key);const hue=h%360;const shift=24+((h>>>9)%33);const sign=((h>>>17)&1)?1:-1;const hue2=(hue+sign*shift+360)%360;const angle=[135,160,200,225][(h>>>20)&3];const from=hsl(hue,.42,.31),to=hsl(hue2,.38,.16),glow=hsl(hue,.6,.55);const gx=20+((h>>>24)%61);return `radial-gradient(circle at ${gx}% 18%, ${glow}59 0%, ${glow}00 70%), linear-gradient(${angle}deg, ${from} 0%, ${to} 100%)`}
// Stand-in for real artwork (mockup only): richer layered gradients.
function artCSS(seed){const h=fnv1a(seed);const a=h%360,b=(a+30+((h>>>8)%60))%360;const x=15+((h>>>4)%70),y=10+((h>>>12)%50),x2=100-x;const band=40+((h>>>16)%35);
 return `radial-gradient(ellipse at ${x}% ${y}%, ${hsl((a+20)%360,.55,.66)}e6 0%, ${hsl(a,.5,.5)}00 42%), radial-gradient(ellipse 80% 40% at ${x2}% ${band+25}%, ${hsl(b,.4,.42)}b3 0%, ${hsl(b,.4,.35)}00 60%), linear-gradient(180deg, ${hsl(a,.32,.34)} 0%, ${hsl(b,.30,.20)} ${band}%, ${hsl(b,.25,.08)} 100%)`}
const sys=document.querySelector('.status .sys').innerHTML;document.querySelectorAll('.status .sys').forEach(e=>e.innerHTML=sys);
document.querySelectorAll('.screen').forEach(sc=>{const tb=sc.querySelector('.tabbar');if(!tb)return;const c=getComputedStyle(sc).backgroundColor;const f=document.createElement('div');f.className='edgefade';const m=c.match(/\d+/g);f.style.background=`linear-gradient(to top, rgba(${m[0]},${m[1]},${m[2]},1) 38%, rgba(${m[0]},${m[1]},${m[2]},0))`;sc.insertBefore(f,sc.querySelector('.mini')||tb)});
document.querySelectorAll('[data-art]').forEach(el=>{el.style.backgroundImage=artCSS(el.dataset.art);el.style.backgroundColor='#222'});
document.querySelectorAll('[data-fallback]').forEach(el=>{const t=el.dataset.fallback;el.style.backgroundImage=fallbackCSS(t);
 const rtl=/[֐-ࣿיִ-﷿ﹰ-﻿]/.test(t);
 el.insertAdjacentHTML('beforeend',`<svg class="i fb-icon" style="width:34%;height:34%;stroke-width:1.4"><use href="#${el.dataset.icon||'film'}"/></svg><div class="fb-title${rtl?' ar':''}" dir="${rtl?'rtl':'ltr'}">${t}</div>`)});
