<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Zoggyfin mark</title>
  <defs>
    <linearGradient id="fin" x1="0.15" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#FF6A4D"/>
      <stop offset="1" stop-color="#FFA270"/>
    </linearGradient>
  </defs>
  <!-- The fin: a forward-leaning shape that also reads as a play arrow -->
  <path d="M26 92 C 34 66, 52 38, 82 22 C 86 20, 90 23, 88 28 C 80 48, 82 70, 104 92 Z" fill="url(#fin)"/>
  <!-- The horizon line, with a gap under the fin's trailing edge -->
  <rect x="14" y="100" width="70" height="7" rx="3.5" fill="#FF7A59"/>
  <rect x="92" y="100" width="22" height="7" rx="3.5" fill="#FF7A59" opacity="0.45"/>
</svg>
